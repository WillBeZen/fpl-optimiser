[pytest]
# Only collect from tests/ (don't walk data/, scripts/, docs/ ...).
testpaths = tests

# Don't auto-load third-party pytest plugins. soccerdata depends on seleniumbase,
# which registers ~6 plugins (seleniumbase, html, metadata, xdist, ...) that would
# otherwise load on every run, slow startup and create downloaded_files/ in the
# repo. This suite needs none of them.
addopts = --disable-plugin-autoload
